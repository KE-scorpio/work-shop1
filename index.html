<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
</head>

<body>
    <div class="offer-card">
        <div class="card-header img-wrapper">
            <img src="intial setup/imgs/image-equilibrium.jpg" alt="">
        </div>
        <div class="card-body">
            <h4 class="card-title">Equilibrium #3429
            </h4>
            <p class="card-desc">Our Equilibrium collection promotes balance and calm.
            </p>
            <div class="offer-details">
                <div class="offer-wrapper">
                    <img src="intial setup/imgs/icons/icon-ethereum.svg" alt="">
                    <p>0.041 ETH</p>
                </div>
                <div class="time-wrapper">
                    <img src="intial setup/imgs/icons/icon-clock.svg" alt="">
                    <p>3 days left</p>

                </div>
            </div>

        </div>
        <div class="card-footer">
            <img src="intial setup/imgs/image-avatar.png" alt="avatar" class="avatar">
            <p class="creator-info">Creation of <span class="creator-name">Jules Wyvern</span></p>

        </div>

    </div>
</body>

</html>
